<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicholas Harrison - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bo2-orange: #ff8c00;
            --bo2-orange-glow: rgba(255, 140, 0, 0.6);
            --bo2-bg: #0b0d10;
            --bo2-panel-bg: rgba(15, 18, 22, 0.95);
        }

        body {
            font-family: 'Teko', sans-serif;
            background-color: var(--bo2-bg);
            color: #d4d4d8;
            overflow: hidden; /* Prevent body scroll, handle scroll in panel */
            user-select: none;
        }

        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }

        .vignette {
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.55) 100%);
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 12;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 140, 0, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            animation: pulseGlow 5s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .menu-item {
            position: relative;
            display: block;
            width: 100%;
            padding: 0.25rem 0;
            padding-left: 0;
            font-size: clamp(1.875rem, 5vw, 3.5rem);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #d4d4d8;
            border-left: 8px solid transparent;
            transition: color 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                padding-left 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                border-color 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                text-shadow 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                background 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            appearance: none;
            background: transparent;
            border-top: 0;
            border-right: 0;
            border-bottom: 0;
            text-align: left;
            font-family: inherit;
        }

        .menu-item--secondary {
            font-size: clamp(1.5rem, 3.25vw, 2rem);
        }

        .menu-item--link {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.75rem;
        }

        .menu-item--link svg {
            flex: 0 0 auto;
            width: 1.5rem;
            height: 1.5rem;
        }

        .menu-item:hover, .menu-item.active, .menu-item:focus-visible {
            color: var(--bo2-orange);
            border-left-color: var(--bo2-orange);
            padding-left: 1.5rem;
            text-shadow: 0 0 15px var(--bo2-orange-glow), 2px 2px 4px rgba(0,0,0,0.8);
            background: linear-gradient(90deg, rgba(255, 140, 0, 0.15) 0%, transparent 100%);
        }

        .portfolio-navigation {
            position: relative;
            display: flex;
            flex: 1;
            align-items: center;
            width: 100%;
            max-width: 64rem;
            min-height: 0;
            margin-top: 3rem;
            overflow-y: auto;
        }

        .menu-primary {
            flex: 0 1 min(34rem, 54%);
            min-width: 0;
        }

        .menu-secondary {
            position: absolute;
            top: var(--submenu-top, 0px);
            left: min(34rem, 54%);
            right: 0;
            min-width: 0;
            padding-left: 1.5rem;
            border-left: 1px solid rgba(255, 140, 0, 0.35);
            animation: menuReveal 0.2s ease-out;
        }

        .menu-secondary[hidden] {
            display: none;
        }

        @keyframes menuReveal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-title-sub {
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            color: #d4d4d8;
            line-height: 1;
        }
        
        .game-title-main {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 0.8;
            color: var(--bo2-orange);
            text-shadow: 0 0 20px var(--bo2-orange-glow), 2px 2px 0px #000;
            letter-spacing: 0.02em;
        }

        .project-teaser {
            position: absolute;
            top: 50%;
            right: clamp(2rem, 4vw, 4rem);
            width: min(38vw, 40rem);
            transform: translateY(-50%);
            z-index: 21;
            pointer-events: auto;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .project-navigation-open .project-teaser,
        .portfolio-panel-open .project-teaser {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .project-teaser__topline,
        .project-teaser__category,
        .project-teaser__image-index,
        .project-teaser__view,
        .project-teaser__footer-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .project-teaser__topline,
        .project-teaser__caption,
        .project-teaser__footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .project-teaser__topline {
            margin-bottom: 0.65rem;
            color: rgba(212, 212, 216, 0.7);
        }

        .project-teaser__topline span:first-child,
        .project-teaser__category {
            color: var(--bo2-orange);
        }

        .project-teaser__media {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #08090b;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left: 2px solid var(--bo2-orange);
        }

        .project-teaser__image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .project-teaser__image.is-changing {
            opacity: 0.25;
        }

        .project-teaser__image-index,
        .project-teaser__view {
            position: absolute;
            padding: 0.45rem 0.6rem;
            color: #fff;
            background: rgba(5, 6, 8, 0.78);
        }

        .project-teaser__image-index {
            top: 0.75rem;
            left: 0.75rem;
        }

        .project-teaser__view {
            right: 0.75rem;
            bottom: 0.75rem;
            color: var(--bo2-orange);
        }

        .project-teaser__caption {
            gap: 1rem;
            margin-top: 0.8rem;
        }

        .project-teaser__category {
            margin: 0 0 0.15rem;
        }

        .project-teaser__title {
            margin: 0;
            color: #f4f4f5;
            font-size: 2.25rem;
            line-height: 0.95;
            text-transform: uppercase;
        }

        .project-teaser__controls {
            display: flex;
            flex: 0 0 auto;
            gap: 0.4rem;
        }

        .project-teaser__control {
            display: grid;
            place-items: center;
            width: 2.5rem;
            height: 2.5rem;
            color: #d4d4d8;
            background: rgba(15, 18, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        .project-teaser__control:hover,
        .project-teaser__control:focus-visible {
            color: var(--bo2-orange);
            border-color: var(--bo2-orange);
            background: rgba(255, 140, 0, 0.1);
        }

        .project-teaser__control svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .project-teaser__footer {
            gap: 1rem;
            margin-top: 0.65rem;
            color: rgba(212, 212, 216, 0.58);
        }

        .project-teaser__dots {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .project-teaser__dot {
            width: 1rem;
            height: 0.35rem;
            padding: 0;
            background: rgba(212, 212, 216, 0.35);
            border: 0;
            cursor: pointer;
            transition: width 0.2s ease, background 0.2s ease;
        }

        .project-teaser__dot[aria-pressed="true"] {
            width: 1.6rem;
            background: var(--bo2-orange);
        }

        @media (max-width: 900px) {
            .project-teaser {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .project-teaser,
            .project-teaser__image,
            .project-teaser__control,
            .project-teaser__dot {
                transition: none;
            }
        }

        @media (max-width: 640px) {
            #mainUi {
                padding: 1.5rem;
            }

            #mainUi nav {
                margin-top: 2rem;
            }

            .portfolio-navigation {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .menu-primary {
                flex: none;
                width: 100%;
            }

            .menu-secondary {
                position: static;
                width: 100%;
                margin-top: 0.75rem;
                padding: 0.75rem 0 0;
                border-top: 1px solid rgba(255, 140, 0, 0.35);
                border-left: 0;
            }

            #mainMenu {
                gap: 0.25rem;
            }

            .game-title-sub {
                font-size: 1rem;
                letter-spacing: 0.15em;
            }

            .game-title-main {
                font-size: clamp(3rem, 12vw, 4.5rem);
            }

            .menu-item:hover, .menu-item.active, .menu-item:focus-visible {
                padding-left: 0.75rem;
            }
        }

        @media (max-width: 640px) and (max-height: 640px) {
            #mainUi {
                padding: 1rem;
            }

            #mainUi nav {
                margin-top: 1rem;
            }

            .portfolio-navigation {
                gap: 0.5rem;
            }

            #mainMenu {
                gap: 0.125rem;
            }

            #mainMenu > li.my-4 {
                margin-block: 0.5rem;
            }

            .menu-item {
                font-size: clamp(1.5rem, 6vh, 2rem);
                padding-top: 0.125rem;
                padding-bottom: 0.125rem;
            }

            .menu-item--secondary {
                font-size: clamp(1.25rem, 4vh, 1.5rem);
            }
        }

        @media (max-height: 640px) and (min-width: 641px) {
            #mainUi {
                padding-top: 2rem;
                padding-bottom: 2rem;
            }

            .portfolio-navigation {
                margin-top: 1.5rem;
            }

            #mainMenu {
                gap: 0.25rem;
            }

            #mainMenu > li.my-4 {
                margin-block: 0.5rem;
            }

            .game-title-sub {
                font-size: 1.125rem;
            }

            .game-title-main {
                font-size: clamp(2.75rem, 8vh, 4.5rem);
            }

            .menu-item {
                font-size: clamp(2rem, 8vh, 3.5rem);
                padding-top: 0.125rem;
                padding-bottom: 0.125rem;
            }

            .menu-item--secondary {
                font-size: clamp(1.5rem, 5vh, 2rem);
            }
        }

        .data-panel {
            background-color: var(--bo2-panel-bg);
            border-left: 2px solid rgba(255, 140, 0, 0.3);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 40; /* Above UI, below scanlines if possible, but practical z-index here */
        }

        .data-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            pointer-events: none;
            z-index: -1;
        }

        .panel-close-btn {
            transition: all 0.2s ease;
        }
        .panel-close-btn:hover {
            color: var(--bo2-orange);
            text-shadow: 0 0 10px var(--bo2-orange-glow);
            transform: scale(1.05);
        }

        /* Custom Scrollbar for Panel */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 140, 0, 0.5);
            border-radius: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--bo2-orange);
        }

        /* Tactical Data Box */
        .tactical-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--bo2-orange);
            position: relative;
        }
        .tactical-box::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 10px; height: 10px;
            border-bottom: 2px solid var(--bo2-orange);
            border-right: 2px solid var(--bo2-orange);
        }
    </style>
</head>
<body class="relative w-full h-screen flex">

    <canvas id="embersCanvas" class="absolute top-0 left-0 w-full h-full z-0"></canvas>
    <div class="ambient-glow"></div>
    
    <!-- UI Container -->
    <div class="relative z-20 w-full h-full flex flex-col p-8 md:p-16 pointer-events-none transition-all duration-500" id="mainUi">
        
        <!-- Top Header Area -->
        <header class="flex justify-between items-start w-full pointer-events-auto">
            <div class="flex flex-col transform transition-transform hover:scale-105 cursor-default origin-top-left">
                <!-- <div class="game-title-sub uppercase text-gray-400 font-mono text-sm mb-1 tracking-[0.3em]">Mechatronics & Autonomous Systems</div> -->
                <div class="game-title-main uppercase mt-1">NICK'S PORTFOLIO</div>
            </div>

            <!-- Status Indicator -->
            <div class="hidden md:flex items-center gap-3 bg-black/40 border border-white/10 p-2 px-4 rounded-sm backdrop-blur-sm">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                <div class="font-mono text-sm tracking-widest text-gray-300">SYSTEM ONLINE</div>
            </div>
        </header>

        <nav class="portfolio-navigation pointer-events-auto" aria-label="Portfolio sections">
            <div class="menu-primary">
                <ul id="mainMenu" class="flex flex-col gap-2">
                    <li><button type="button" class="menu-item" data-menu-group="robotics" aria-controls="secondaryMenu" aria-expanded="false">Projects</button></li>
                    <li><button type="button" class="menu-item" data-menu-group="teams" aria-controls="secondaryMenu" aria-expanded="false">Research</button></li>
                
                    <li class="my-4"><div class="w-full h-px bg-white/10"></div></li>
                    <li><button type="button" class="menu-item menu-item--secondary" data-target="about">About Me</button></li>
                    <li><button type="button" class="menu-item menu-item--secondary" data-menu-group="contact" aria-controls="secondaryMenu" aria-expanded="false">Resume & Contact</button></li>
                </ul>
            </div>
            <ul id="secondaryMenu" class="menu-secondary flex flex-col gap-2" aria-label="Projects" hidden></ul>
        </nav>

        <aside class="project-teaser" id="projectTeaser" aria-label="Featured projects">
            <div class="project-teaser__topline">
                <span>Project Spotlight</span>
                <span id="projectSlideCount">01 / 09</span>
            </div>
            <a class="project-teaser__media" id="projectSlideLink" href="project-quadcopter-drone.html" aria-label="View Quadcopter Drone project">
                <img class="project-teaser__image" id="projectSlideImage" src="images/Projects/Quadcopter/Top%20view.png" alt="Top-down CAD render of a quadcopter frame" fetchpriority="high">
                <span class="project-teaser__image-index" id="projectSlideIndex">PROJECT 01</span>
                <span class="project-teaser__view">View Project &rarr;</span>
            </a>
            <div class="project-teaser__caption">
                <div>
                    <p class="project-teaser__category" id="projectSlideCategory">Flight Systems</p>
                    <h2 class="project-teaser__title" id="projectSlideTitle">Quadcopter Drone</h2>
                </div>
                <div class="project-teaser__controls" aria-label="Project slideshow controls">
                    <button type="button" class="project-teaser__control" id="projectSlidePrevious" aria-label="Previous project" title="Previous project">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
                    </button>
                    <button type="button" class="project-teaser__control" id="projectSlideNext" aria-label="Next project" title="Next project">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
                    </button>
                </div>
            </div>
            <div class="project-teaser__footer">
                <span class="project-teaser__footer-label">Selected Work</span>
                <div class="project-teaser__dots" id="projectSlideDots" role="group" aria-label="Choose a featured project"></div>
            </div>
        </aside>

        <!-- Bottom HUD Elements -->
        <footer class="w-full flex justify-between items-end mt-auto pointer-events-auto font-mono text-xs text-white/60">
            <div>
                <div>SYS.VER: 2.0.26</div>
                <div>LOC: TORONTO, ON</div>
            </div>
            <div class="text-right">
                <div>[DATA_LINK_SECURE]</div>
            </div>
        </footer>
    </div>

    <!-- Slide-in Panel -->
    <div id="dataPanel" class="data-panel fixed top-0 right-0 w-full md:w-[600px] h-full transform translate-x-full flex flex-col pointer-events-auto shadow-2xl">
        <!-- Panel Header -->
        <div class="flex justify-between items-center p-6 border-b border-white/10 bg-black/40">
            <h2 id="panelTitle" class="text-3xl text-white tracking-widest uppercase text-shadow-sm">Section Title</h2>
            <button id="closePanelBtn" class="panel-close-btn flex items-center gap-2 text-xl text-gray-400 hover:text-white font-mono uppercase">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                Close
            </button>
        </div>
        
        <!-- Panel Content Area -->
        <div id="panelContentArea" class="flex-1 p-8 overflow-y-auto custom-scroll relative z-10 text-lg">
            <!-- Content gets injected here -->
        </div>
    </div>

    <!-- Background effects applied over everything except panel -->
    <div class="vignette pointer-events-none z-50"></div>

    <!-- TEMPLATES FOR PANEL CONTENT -->
    <template id="tpl-robotics">
        <div class="space-y-8 animate-fade-in">
            <div class="tactical-box p-5">
                <h3 class="text-2xl text-[var(--bo2-orange)] mb-2 uppercase tracking-wide">Quadcopter Drone Firmware</h3>
                <p class="font-sans text-gray-300 text-sm mb-4 leading-relaxed">Developed custom flight controller firmware. Implemented PID control loops for stabilization and responsive maneuvering based on real-time telemetry.</p>
                <div class="flex gap-2">
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">C++</span>
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Control Systems</span>
                </div>
            </div>

            <div class="tactical-box p-5">
                <h3 class="text-2xl text-[var(--bo2-orange)] mb-2 uppercase tracking-wide">IMU Sensor Fusion</h3>
                <p class="font-sans text-gray-300 text-sm mb-4 leading-relaxed">Engineered robust state estimation algorithms combining accelerometer and gyroscope data. Utilized complementary and Kalman filtering to eliminate drift and noise for accurate 3D spatial orientation.</p>
                <div class="flex gap-2">
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Signal Processing</span>
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Python</span>
                </div>
            </div>

            <div class="tactical-box p-5">
                <h3 class="text-2xl text-[var(--bo2-orange)] mb-2 uppercase tracking-wide">MPC & Dynamics Simulations</h3>
                <p class="font-sans text-gray-300 text-sm mb-4 leading-relaxed">Built interactive Pygame environments to simulate and visualize Model Predictive Control (MPC). Modeled complex systems including quarter-car suspension dynamics to optimize ride comfort and road handling.</p>
                <div class="flex gap-2">
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Pygame</span>
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Optimization</span>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-teams">
        <div class="space-y-8 animate-fade-in">
           
            <div class="tactical-box p-5">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-2xl text-[var(--bo2-orange)] uppercase tracking-wide">2026 International Conference on Vehicle Engineering and Intelligent Control. SAE.</h3>
                    
                </div>
                <p class="font-sans text-gray-300 text-sm mb-4 leading-relaxed">Contributed to a research paper "CurveGuard," an advanced predictive speed advisory system. The system leverages geospatial data and vehicle dynamics to improve safety on for transport trucks. <br>Zhang, Q., Jiang, X., Harrison, N., Ali, S., Khirallah, Y., Lu, Y.* (2026, September). CurveGuard: A Physics-Informed Predictive Speed and Braking Advisory System for Heavy Trucks. 2026 International Conference on Vehicle Engineering and Intelligent Control (VEIC). SAE.</p>
                <div class="flex gap-2">
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Research</span>
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">Data Analysis</span>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-hardware">
        <div class="space-y-8 animate-fade-in">
            <div class="tactical-box p-5">
                <h3 class="text-2xl text-[var(--bo2-orange)] mb-2 uppercase tracking-wide">SolidWorks & Multi-body Modeling</h3>
                <p class="font-sans text-gray-300 text-sm mb-4 leading-relaxed">Extensive experience in 3D CAD modeling. Created complex multi-body assemblies, performed interference detection, and generated production-ready engineering drawings.</p>
                <div class="flex gap-2">
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">SolidWorks</span>
                    <span class="text-xs font-mono bg-white/10 px-2 py-1 rounded text-gray-400">DFMA</span>
                </div>
            </div>

            <div class="tactical-box p-5">

        // --- Web Audio API Setup ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;

        function createOscillatorNode(freq, type, duration, vol) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playHoverSound() {
            createOscillatorNode(180, 'square', 0.05, 0.02);
            setTimeout(() => createOscillatorNode(240, 'square', 0.05, 0.01), 20);
        }

            createOscillatorNode(100, 'sawtooth', 0.15, 0.05);

        }

        // --- STREAMING_CHUNK:Setting up canvas particle system... ---
        const canvas = document.getElementById('embersCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = (Math.random() * 1.5 + 0.5) * -1; // Drift up
                this.speedX = (Math.random() - 0.5) * 1; // Drift side
                this.life = Math.random() * 0.5 + 0.5; // Opacity
                this.decay = Math.random() * 0.005 + 0.002;
                
                // Color variation (orange to red/yellow)
                const hue = Math.floor(Math.random() * 30 + 15); 
                this.color = `hsla(${hue}, 100%, 60%, `; 
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                this.speedX += (Math.random() - 0.5) * 0.1;

                if (this.life <= 0 || this.y < -10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.max(0, this.life) + ')';
                ctx.fill();
            }
        }

        const particleCount = 120;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // Motion blur effect
            ctx.fillStyle = 'rgba(11, 13, 16, 0.4)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.onload = animate;
    </script>
